name: Smart E-Bike CI

on:
  push:
  pull_request:

jobs:

  tests:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: ebike_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ebike_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: ebike_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        run: |
          pytest -v tests/test_model_V42.py tests/test_api_V42.py